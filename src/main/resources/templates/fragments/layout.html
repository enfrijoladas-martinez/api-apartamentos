<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Apartamentos'">Apartamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!-- Barra lateral de navegación (en móvil se convierte en barra superior) -->
<nav th:fragment="navbar" class="app-sidebar" aria-label="Navegación principal">
    <a class="sidebar-brand" th:href="@{/}">
        <span class="brand-mark"><i class="bi bi-buildings"></i></span>
        <span class="brand-text">Apartamentos<small>Gestión de alquileres</small></span>
    </a>
    <p class="sidebar-label">General</p>
    <ul class="sidebar-nav">
        <li><a th:href="@{/}" data-match="/"><i class="bi bi-grid-1x2"></i><span>Resumen</span></a></li>
    </ul>
    <p class="sidebar-label">Inventario</p>
    <ul class="sidebar-nav">
        <li><a th:href="@{/propiedades}" data-match="/propiedades"><i class="bi bi-house-door"></i><span>Propiedades</span></a></li>
        <li><a th:href="@{/unidades}" data-match="/unidades"><i class="bi bi-door-open"></i><span>Unidades</span></a></li>
    </ul>
    <p class="sidebar-label">Operación</p>
    <ul class="sidebar-nav">
        <li><a th:href="@{/clientes}" data-match="/clientes"><i class="bi bi-people"></i><span>Clientes</span></a></li>
        <li><a th:href="@{/reservas}" data-match="/reservas"><i class="bi bi-calendar-check"></i><span>Reservas</span></a></li>
        <li><a th:href="@{/pagos}" data-match="/pagos"><i class="bi bi-credit-card"></i><span>Pagos</span></a></li>
    </ul>
    <a class="btn btn-accent sidebar-cta" th:href="@{/propiedades/nueva}"><i class="bi bi-plus-lg"></i> Nueva propiedad</a>
    <script>
        // Marca como activa la sección en la que está el usuario
        (function () {
            var path = window.location.pathname;
            document.querySelectorAll('.sidebar-nav a[data-match]').forEach(function (a) {
                var m = a.getAttribute('data-match');
                if ((m === '/' && (path === '/' || path === '/dashboard')) || (m !== '/' && path.indexOf(m) === 0)) {
                    a.classList.add('active');
                }
            });
        })();
    </script>
</nav>
<div th:fragment="alerts" class="app-shell pt-4">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>
<footer th:fragment="footer" class="app-shell app-footer">
    <span>Apartamentos · Panel de gestión de alquileres</span><span>Spring Boot + Thymeleaf + MySQL</span>
</footer>
<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

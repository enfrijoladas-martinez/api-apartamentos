<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modo} + ' reserva')}"></head>
<body class="app-body">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="app-shell py-5 form-page">
    <a class="back-link" th:href="@{/reservas}">← Volver a reservas</a>
    <div class="page-header compact"><div><p class="eyebrow">OPERACIÓN</p><h1 th:text="${modo + ' reserva'}">Crear reserva</h1><p class="page-lede">El importe se calcula con el precio nocturno de la unidad.</p></div></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form class="form-surface" th:object="${reserva}" th:action="${modo == 'Crear'} ? @{/reservas} : @{/reservas/{id}(id=${reserva.idReservacion})}" method="post">
        <div class="row g-4">
            <div class="col-md-6"><label class="form-label">Huésped</label><select class="form-select" name="clienteId" required><option value="">Selecciona un cliente</option><option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:selected="${reserva.cliente != null and reserva.cliente.id == cliente.id}" th:text="${cliente.nombres + ' ' + cliente.apellidos + ' · ' + cliente.email}"></option></select></div>
            <div class="col-md-6"><label class="form-label">Unidad rentable</label><select class="form-select" name="unidadId" required><option value="">Selecciona una unidad</option><option th:each="unidad : ${unidades}" th:value="${unidad.idUnidad}" th:selected="${reserva.unidad != null and reserva.unidad.idUnidad == unidad.idUnidad}" th:text="${unidad.nombre + ' · ' + unidad.propiedad.titulo + ' · $' + unidad.precioNoche + '/noche'}"></option></select></div>
            <div class="col-md-6"><label class="form-label">Fecha y hora de entrada</label><input class="form-control" type="datetime-local" th:field="*{fechaEntrada}" required></div>
            <div class="col-md-6"><label class="form-label">Fecha y hora de salida</label><input class="form-control" type="datetime-local" th:field="*{fechaSalida}" required></div>
            <div class="col-md-6"><label class="form-label">Estado</label><select class="form-select" th:field="*{estado}"><option value="PENDIENTE">PENDIENTE</option><option value="CONFIRMADA">CONFIRMADA</option><option value="CHECKIN">CHECK-IN</option><option value="CHECKOUT">CHECK-OUT</option><option value="CANCELADA">CANCELADA</option></select></div>
            <div class="col-12"><label class="form-label">Comentario</label><textarea class="form-control" rows="3" th:field="*{comentario}" placeholder="Notas de la estancia"></textarea></div>
        </div>
        <div class="form-actions"><a class="btn btn-light" th:href="@{/reservas}">Cancelar</a><button class="btn btn-accent" type="submit" th:text="${modo + ' reserva'}">Guardar</button></div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer><script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

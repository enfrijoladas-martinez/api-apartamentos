<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reservas')}"></head>
<body class="app-body">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="app-shell py-5">
    <div class="page-header">
        <div><p class="eyebrow">OPERACIÓN</p><h1>Reservas</h1><p class="page-lede">Consulta estancias, estados y disponibilidad en un solo lugar.</p></div>
        <a class="btn btn-accent" th:href="@{/reservas/nueva}">+ Nueva reserva</a>
    </div>
    <div class="table-wrap">
        <table class="table align-middle mb-0">
            <thead><tr><th>Huésped</th><th>Unidad</th><th>Estancia</th><th>Importe</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(reservas)}"><td colspan="6" class="empty-table">No hay reservas para mostrar.</td></tr>
                <tr th:each="reserva : ${reservas}">
                    <td><div class="d-flex align-items-center gap-3"><div class="initials" th:text="${#strings.substring(reserva.cliente.nombres, 0, 1) + #strings.substring(reserva.cliente.apellidos, 0, 1)}">CL</div><div><strong th:text="${reserva.cliente.nombres + ' ' + reserva.cliente.apellidos}">Huésped</strong><small class="d-block text-muted" th:text="${reserva.cliente.email}">email</small></div></div></td>
                    <td><strong th:text="${reserva.unidad.nombre}">Unidad</strong><small class="d-block text-muted" th:text="${reserva.unidad.propiedad.titulo}">Propiedad</small></td>
                    <td><span th:text="${#temporals.format(reserva.fechaEntrada, 'dd/MM/yyyy HH:mm')}">Entrada</span><small class="d-block text-muted" th:text="${'hasta ' + #temporals.format(reserva.fechaSalida, 'dd/MM/yyyy HH:mm')}">Salida</small></td>
                    <td th:text="${reserva.importeTotal != null ? '$' + reserva.importeTotal : 'Pendiente'}">$0</td>
                    <td><span class="badge-status" th:classappend="${reserva.estado == 'CANCELADA' ? ' badge-cancelled' : ''}" th:text="${reserva.estado}">PENDIENTE</span></td>
                    <td class="text-end"><a class="action-link" th:href="@{/reservas/{id}/editar(id=${reserva.idReservacion})}">Editar</a><form class="d-inline" th:action="@{/reservas/{id}/cancelar(id=${reserva.idReservacion})}" method="post"><button class="action-link action-danger" type="submit" th:disabled="${reserva.estado == 'CANCELADA'}">Cancelar</button></form></td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer><script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modo} + ' cliente')}"></head>
<body class="app-body"><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div>
<main class="app-shell py-5 form-page"><a class="back-link" th:href="@{/clientes}">← Volver a clientes</a><div class="page-header compact"><div><p class="eyebrow">DIRECTORIO</p><h1 th:text="${modo + ' cliente'}">Crear cliente</h1></div></div>
<form class="form-surface" th:object="${cliente}" th:action="${modo == 'Crear'} ? @{/clientes} : @{/clientes/{id}(id=${cliente.id})}" method="post"><div class="row g-4"><div class="col-md-6"><label class="form-label">Nombres</label><input class="form-control" th:field="*{nombres}" required><div class="field-error" th:errors="*{nombres}"></div></div><div class="col-md-6"><label class="form-label">Apellidos</label><input class="form-control" th:field="*{apellidos}" required><div class="field-error" th:errors="*{apellidos}"></div></div><div class="col-md-6"><label class="form-label">Correo electrónico</label><input class="form-control" type="email" th:field="*{email}" required><div class="field-error" th:errors="*{email}"></div></div><div class="col-md-6"><label class="form-label">Teléfono</label><input class="form-control" th:field="*{telefono}"></div><div class="col-md-6"><label class="form-label">Tipo</label><select class="form-select" th:field="*{tipo}"><option th:each="tipo : ${T(com.api.apartamentos.models.ClienteModel.TipoCliente).values()}" th:value="${tipo}" th:text="${tipo}"></option></select></div><div class="col-md-6"><label class="form-label">Estado</label><select class="form-select" th:field="*{estatus}"><option th:each="estado : ${T(com.api.apartamentos.models.ClienteModel.ClienteStatus).values()}" th:value="${estado}" th:text="${estado}"></option></select></div><div class="col-md-6"><label class="form-label">Fecha de nacimiento</label><input class="form-control" type="date" th:field="*{fechaNacimiento}"></div><div class="col-md-6"><label class="form-label">INE</label><input class="form-control" th:field="*{ine}"></div><div class="col-12"><label class="form-label">Dirección</label><input class="form-control" th:field="*{direccion}"></div><div class="col-md-6"><label class="form-label" th:text="${modo == 'Crear' ? 'Contraseña' : 'Nueva contraseña (opcional)'}">Contraseña</label><input class="form-control" type="password" th:field="*{password}" th:required="${modo == 'Crear'}"><div class="field-error" th:errors="*{password}"></div></div></div><div class="form-actions"><a class="btn btn-light" th:href="@{/clientes}">Cancelar</a><button class="btn btn-accent" type="submit" th:text="${modo + ' cliente'}">Guardar</button></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:replace="~{fragments/layout :: scripts}"></script></body></html>

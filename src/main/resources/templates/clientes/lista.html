<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body class="app-body">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="app-shell py-5">
    <div class="page-header"><div><p class="eyebrow">DIRECTORIO</p><h1>Clientes</h1><p class="page-lede">Personas y organizaciones vinculadas a tu operación.</p></div><a class="btn btn-accent" th:href="@{/clientes/nuevo}">+ Nuevo cliente</a></div>
    <div class="table-wrap">
        <table class="table align-middle mb-0"><thead><tr><th>Cliente</th><th>Contacto</th><th>Tipo</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
        <tbody><tr th:if="${#lists.isEmpty(clientes)}"><td colspan="5" class="empty-table">No hay clientes para mostrar.</td></tr>
        <tr th:each="cliente : ${clientes}"><td><div class="d-flex align-items-center gap-3"><div class="initials" th:text="${#strings.substring(cliente.nombres, 0, 1) + #strings.substring(cliente.apellidos, 0, 1)}">CL</div><div><strong th:text="${cliente.nombres + ' ' + cliente.apellidos}">Nombre</strong><small class="d-block text-muted" th:text="${cliente.ine != null ? 'INE ' + cliente.ine : 'Sin INE'}">INE</small></div></div></td><td><span th:text="${cliente.email}">email</span><small class="d-block text-muted" th:text="${cliente.telefono != null ? cliente.telefono : 'Sin teléfono'}">teléfono</small></td><td th:text="${cliente.tipo}">CLIENTE</td><td><span class="badge-status" th:text="${cliente.estatus}">ACTIVO</span></td><td class="text-end"><a class="action-link" th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar</a><form class="d-inline" th:action="@{/clientes/{id}/eliminar(id=${cliente.id})}" method="post"><button class="action-link action-danger" type="submit">Eliminar</button></form></td></tr></tbody></table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer><script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

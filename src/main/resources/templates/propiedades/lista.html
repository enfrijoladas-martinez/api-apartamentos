<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Propiedades')}"></head>
<body class="app-body"><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div>
<main class="app-shell py-5"><div class="page-header"><div><p class="eyebrow">INVENTARIO</p><h1>Propiedades</h1><p class="page-lede">Espacios publicados y listos para operar.</p></div><a class="btn btn-accent" th:href="@{/propiedades/nueva}">+ Nueva propiedad</a></div>
<div class="property-grid"><div th:if="${#lists.isEmpty(propiedades)}" class="empty-state">No hay propiedades para mostrar.</div><article class="property-card" th:each="propiedad : ${propiedades}"><div class="property-card-top"><span class="property-type" th:text="${propiedad.tipo}">CASA</span><span class="badge-status" th:text="${propiedad.estado}">DISPONIBLE</span></div><div class="property-symbol" th:text="${#strings.substring(propiedad.titulo, 0, 1).toUpperCase()}">P</div><h2 th:text="${propiedad.titulo}">Título</h2><p class="text-muted" th:text="${propiedad.ciudad + ', ' + propiedad.pais}">Ciudad, país</p><div class="property-meta"><span th:text="${propiedad.capacidad + ' huéspedes'}">0 huéspedes</span><strong th:text="${propiedad.precioNoche != null ? '$' + propiedad.precioNoche + ' / noche' : 'Precio pendiente'}">$0 / noche</strong></div><div class="property-actions"><a class="action-link" th:href="@{/propiedades/{id}/unidades(id=${propiedad.idPropiedad})}">Unidades</a><a class="action-link" th:href="@{/propiedades/{id}/editar(id=${propiedad.idPropiedad})}">Editar</a><form th:action="@{/propiedades/{id}/eliminar(id=${propiedad.idPropiedad})}" method="post"><button class="action-link action-danger" type="submit">Eliminar</button></form></div></article></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:replace="~{fragments/layout :: scripts}"></script></body></html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modo} + ' propiedad')}"></head>
<body class="app-body"><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div><main class="app-shell py-5 form-page"><a class="back-link" th:href="@{/propiedades}">← Volver a propiedades</a><div class="page-header compact"><div><p class="eyebrow">INVENTARIO</p><h1 th:text="${modo + ' propiedad'}">Crear propiedad</h1></div></div>
<form class="form-surface" th:object="${propiedad}" th:action="${modo == 'Crear'} ? @{/propiedades} : @{/propiedades/{id}(id=${propiedad.idPropiedad})}" method="post"><div class="row g-4"><div class="col-md-8"><label class="form-label">Título</label><input class="form-control" th:field="*{titulo}" required></div><div class="col-md-4"><label class="form-label">Tipo</label><input class="form-control" th:field="*{tipo}" placeholder="Apartamento, casa..." required></div><div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" rows="3" th:field="*{descripcion}" required></textarea></div><div class="col-md-6"><label class="form-label">Propietario</label><select class="form-select" name="propietarioId" required><option value="">Selecciona un cliente</option><option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:selected="${propiedad.propietario != null and propiedad.propietario.id == cliente.id}" th:text="${cliente.nombres + ' ' + cliente.apellidos}"></option></select></div><div class="col-md-6"><label class="form-label">Estado</label><select class="form-select" th:field="*{estado}"><option th:each="estado : ${T(com.api.apartamentos.models.PropiedadModel.EstadoPropiedad).values()}" th:value="${estado}" th:text="${estado}"></option></select></div><div class="col-md-6"><label class="form-label">Dirección</label><input class="form-control" th:field="*{direccion}" required></div><div class="col-md-3"><label class="form-label">Ciudad</label><input class="form-control" th:field="*{ciudad}" required></div><div class="col-md-3"><label class="form-label">Estado / provincia</label><input class="form-control" th:field="*{estadoFederativo}" required></div><div class="col-md-4"><label class="form-label">Código postal</label><input class="form-control" th:field="*{codigoPostal}" required></div><div class="col-md-4"><label class="form-label">País</label><input class="form-control" th:field="*{pais}" required></div><div class="col-md-4"><label class="form-label">Precio por noche</label><input class="form-control" type="number" step="0.01" min="0" th:field="*{precioNoche}" required></div><div class="col-md-3"><label class="form-label">Capacidad</label><input class="form-control" type="number" min="1" th:field="*{capacidad}" required></div><div class="col-md-3"><label class="form-label">Habitaciones</label><input class="form-control" type="number" min="0" th:field="*{numHabitaciones}" required></div><div class="col-md-3"><label class="form-label">Baños</label><input class="form-control" type="number" min="0" th:field="*{numBanos}" required></div><div class="col-md-3"><label class="form-label">Metros cuadrados</label><input class="form-control" type="number" min="0" th:field="*{metrosCuadrados}" required></div><div class="col-md-6"><label class="form-label">Comodidades</label><textarea class="form-control" rows="2" th:field="*{comodidades}"></textarea></div><div class="col-md-6"><label class="form-label">Reglas</label><textarea class="form-control" rows="2" th:field="*{reglas}"></textarea></div></div><div class="form-actions"><a class="btn btn-light" th:href="@{/propiedades}">Cancelar</a><button class="btn btn-accent" type="submit" th:text="${modo + ' propiedad'}">Guardar</button></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:replace="~{fragments/layout :: scripts}"></script></body></html>

spring.application.name=apartamentos

# Variables de entorno: se leen del sistema o del archivo .env (ver .env.example)
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8000}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:apartamentos}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# true: las relaciones LAZY se cargan al convertir la respuesta a JSON
spring.jpa.open-in-view=true
